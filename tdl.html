```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CM25012</title>
    <link rel="stylesheet" href="src/output.css">
    <!-- Tailwind CSS CDN -->
    
</head>

<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto px-4 py-8">

        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600
                    text-white rounded-3xl p-6 shadow-xl mb-6">

            <p class="text-indigo-200 text-sm">
                ✨ MY PRODUCTIVITY SPACE
            </p>

            <h1 class="text-3xl md:text-4xl font-bold mt-2">
                My Daily Tasks
            </h1>

            <p class="text-indigo-100 mt-2">
                Plan it. Do it. Complete it. 🚀
            </p>

        </div>


        <!-- Statistics -->
        <div class="grid grid-cols-2 gap-4 mb-6">

            <div class="bg-white rounded-2xl p-4 shadow-md text-center">
                <p class="text-gray-500 text-sm">
                    Total Tasks
                </p>

                <p id="totalTasks"
                   class="text-3xl font-bold text-indigo-600">
                    0
                </p>
            </div>


            <div class="bg-white rounded-2xl p-4 shadow-md text-center">
                <p class="text-gray-500 text-sm">
                    Completed
                </p>

                <p id="completedTasks"
                   class="text-3xl font-bold text-green-500">
                    0
                </p>
            </div>

        </div>


        <!-- Add Task Card -->
        <div class="bg-white rounded-3xl p-5 shadow-lg mb-6">

            <h2 class="font-bold text-xl text-gray-800 mb-4">
                📝 Add a New Task
            </h2>

            <div class="flex flex-col sm:flex-row gap-3">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    class="flex-1 border-2 border-gray-200 rounded-xl
                           px-4 py-3 outline-none
                           focus:border-indigo-500 transition"
                >

                <select
                    id="priority"
                    class="border-2 border-gray-200 rounded-xl px-3 py-3
                           focus:border-indigo-500 outline-none">

                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>

                </select>

                <button
                    onclick="addTask()"
                    class="bg-indigo-600 hover:bg-indigo-700
                           text-white font-semibold px-6 py-3
                           rounded-xl transition transform
                           hover:scale-105">

                    + Add

                </button>

            </div>

        </div>


        <!-- Task List -->
        <div class="bg-white rounded-3xl p-5 shadow-lg">

            <div class="flex justify-between items-center mb-4">

                <h2 class="text-xl font-bold text-gray-800">
                    📋 Today's Tasks
                </h2>

                <span class="text-sm text-gray-400">
                    Click a task to complete
                </span>

            </div>

            <ul id="taskList" class="space-y-3"></ul>

            <p id="emptyMessage"
               class="text-center text-gray-400 py-8">

                🎯 No tasks yet. Add your first task!

            </p>

        </div>

    </div>


    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let priority = document.getElementById("priority");

            let taskText = input.value.trim();

            // Validation
            if (taskText === "") {

                alert("Please enter a task!");

                return;
            }


            // Create task
            let li = document.createElement("li");

            li.className =
                "flex items-center gap-3 p-4 rounded-2xl " +
                "bg-gray-50 border border-gray-100 " +
                "hover:shadow-md transition";


            // Priority color
            let priorityClass = "";

            if (priority.value === "High") {

                priorityClass =
                    "bg-red-100 text-red-600";

            }
            else if (priority.value === "Medium") {

                priorityClass =
                    "bg-yellow-100 text-yellow-600";

            }
            else {

                priorityClass =
                    "bg-green-100 text-green-600";
            }


            li.innerHTML = `

                <button
                    onclick="completeTask(this)"
                    class="w-7 h-7 border-2 border-indigo-400
                           rounded-full hover:bg-indigo-100
                           transition">

                </button>


                <div class="flex-1">

                    <p class="taskText font-medium text-gray-800">
                        ${taskText}
                    </p>

                    <span class="${priorityClass}
                                 text-xs px-2 py-1 rounded-full">

                        ${priority.value} Priority

                    </span>

                </div>


                <button
                    onclick="deleteTask(this)"
                    class="text-red-500 hover:text-red-700
                           text-xl transition">

                    🗑️

                </button>

            `;


            document.getElementById("taskList")
                    .appendChild(li);


            input.value = "";

            updateCount();

            document.getElementById("emptyMessage")
                    .classList.add("hidden");
        }


        // Mark task completed
        function completeTask(button) {

            let task = button.parentElement;

            let text = task.querySelector(".taskText");


            text.classList.toggle("line-through");

            text.classList.toggle("text-gray-400");

            button.classList.toggle("bg-green-500");

            button.innerHTML = "✓";

            updateCount();
        }


        // Delete task
        function deleteTask(button) {

            button.parentElement.remove();

            updateCount();


            let list = document.getElementById("taskList");

            if (list.children.length === 0) {

                document.getElementById("emptyMessage")
                        .classList.remove("hidden");
            }
        }


        // Update statistics
        function updateCount() {

            let tasks =
                document.getElementById("taskList").children;

            let total = tasks.length;

            let completed = 0;


            for (let task of tasks) {

                let text =
                    task.querySelector(".taskText");

                if (text.classList.contains("line-through")) {

                    completed++;
                }
            }


            document.getElementById("totalTasks")
                    .innerText = total;

            document.getElementById("completedTasks")
                    .innerText = completed;
        }

    </script>

</body>

</html>
