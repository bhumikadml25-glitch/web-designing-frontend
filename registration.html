<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM25012</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">

        <!-- Header -->
        <header class="bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white text-center p-6">
            <h1 class="text-3xl font-bold">
                Student Registration Form
            </h1>
            <p class="text-violet-100 mt-2">
                Enter your details to complete registration
            </p>
        </header>

        <!-- Form -->
        <form id="registrationForm" class="p-8 space-y-5">

            <!-- Student Name -->
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-violet-500
                    focus:border-violet-500"
                >

                <p id="nameError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Mobile Number -->
            <div>
                <label for="number" class="block text-sm font-semibold text-slate-700 mb-2">
                    Student Contact Number
                </label>

                <input
                    type="text"
                    id="number"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-violet-500
                    focus:border-violet-500"
                >

                <p id="numberError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                    Student Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-violet-500
                    focus:border-violet-500"
                >

                <p id="emailError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Date of Birth -->
            <div>
                <label for="dob" class="block text-sm font-semibold text-slate-700 mb-2">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-violet-500
                    focus:border-violet-500"
                >

                <p id="dobError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                    Registration Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password (minimum 6 characters)"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-violet-500
                    focus:border-violet-500"
                >

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-violet-600 hover:bg-violet-700
                text-white font-semibold py-3 rounded-lg
                transition duration-300 shadow-md"
            >
                Register Student
            </button>

            <!-- Success Message -->
            <p
                id="successMessage"
                class="text-green-600 text-center font-semibold"
            ></p>

        </form>
    </div>


    <!-- JavaScript -->
    <script>

        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {

            // Stop form from submitting initially
            event.preventDefault();

            // Get values
            const name = document.getElementById("name").value.trim();
            const number = document.getElementById("number").value.trim();
            const email = document.getElementById("email").value.trim();
            const dob = document.getElementById("dob").value;
            const password = document.getElementById("password").value;

            // Error elements
            const nameError = document.getElementById("nameError");
            const numberError = document.getElementById("numberError");
            const emailError = document.getElementById("emailError");
            const dobError = document.getElementById("dobError");
            const passwordError = document.getElementById("passwordError");
            const successMessage = document.getElementById("successMessage");

            // Clear previous messages
            nameError.textContent = "";
            numberError.textContent = "";
            emailError.textContent = "";
            dobError.textContent = "";
            passwordError.textContent = "";
            successMessage.textContent = "";

            let isValid = true;


            // 1. Mandatory Name Validation
            if (name === "") {
                nameError.textContent = "Student name is required.";
                isValid = false;
            }


            // 2. Mobile Number Validation
            const mobilePattern = /^[0-9]{10}$/;

            if (number === "") {
                numberError.textContent = "Contact number is required.";
                isValid = false;
            }
            else if (!mobilePattern.test(number)) {
                numberError.textContent = "Enter a valid 10-digit mobile number.";
                isValid = false;
            }


            // 3. Email Validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                emailError.textContent = "Email is required.";
                isValid = false;
            }
            else if (!emailPattern.test(email)) {
                emailError.textContent = "Enter a valid email address.";
                isValid = false;
            }


            // 4. Date of Birth Validation
            if (dob === "") {
                dobError.textContent = "Date of birth is required.";
                isValid = false;
            }


            // 5. Password Validation
            if (password === "") {
                passwordError.textContent = "Password is required.";
                isValid = false;
            }
            else if (password.length < 6) {
                passwordError.textContent =
                    "Password must contain at least 6 characters.";
                isValid = false;
            }


            // 6. Final Result
            if (isValid) {

                successMessage.textContent =
                    "Registration successful!";

                form.reset();
            }

        });

    </script>

</body>
</html>
